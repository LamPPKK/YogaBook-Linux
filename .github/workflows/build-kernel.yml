name: Build Yoga Book kernel

on:
  workflow_dispatch:
    inputs:
      kernel-ref:
        description: Kernel tag or branch to build
        required: true
        default: v6.18.x-yogabook
      local-version:
        description: Local kernel version suffix
        required: true
        default: -yogabook
  push:
    tags:
      - 'kernel-*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    env:
      KERNEL_REPOSITORY: https://github.com/jekhor/yogabook-linux-kernel.git
      KERNEL_REF: ${{ inputs.kernel-ref || 'v6.18.x-yogabook' }}
      LOCAL_VERSION: ${{ inputs.local-version || '-yogabook' }}

    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential cpio debhelper-compat dwarves flex fakeroot \
            libdw-dev libelf-dev libssl-dev rsync kmod curl

      - name: Check out kernel source
        run: |
          ./scripts/build/prepare-kernel.sh kernel "$KERNEL_REPOSITORY" "$KERNEL_REF"

      - name: Build Debian packages
        run: |
          ./scripts/build/build-kernel.sh deb kernel artifacts "$LOCAL_VERSION"

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-ubuntu-${{ matrix.ubuntu }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
