name: Build native Yoga Book packages

on:
  workflow_dispatch:
    inputs:
      kernel-ref:
        description: Kernel tag or branch
        required: true
        default: v7.2.8

permissions:
  contents: read

env:
  KERNEL_REPOSITORY: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  KERNEL_REF: ${{ inputs.kernel-ref || 'v7.2.8' }}

jobs:
  fedora-rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora build dependencies
        run: |
          dnf install -y bc bison cpio dwarves flex gcc gcc-c++ make \
            openssl openssl-devel perl elfutils-devel elfutils-libelf-devel \
            rsync rpm-build git curl
      - name: Build RPM packages
        run: |
          ./scripts/build/prepare-kernel.sh kernel "$KERNEL_REPOSITORY" "$KERNEL_REF"
          ./scripts/build/build-kernel.sh rpm kernel artifacts -yogabook7.2
      - name: Upload Fedora RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-fedora-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed bc bison cpio diffutils pahole flex \
            gcc make openssl libelf python rsync tar xz git curl
      - name: Build kernel and modules archive
        run: |
          ./scripts/build/prepare-kernel.sh kernel "$KERNEL_REPOSITORY" "$KERNEL_REF"
          ./scripts/build/build-kernel.sh arch kernel artifacts -yogabook7.2
      - name: Upload Arch kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-arch-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  chromiumos-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ChromiumOS kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential cpio dwarves flex libdw-dev \
            libelf-dev libssl-dev rsync kmod git curl
      - name: Build generic ChromiumOS-compatible x86 kernel
        run: |
          ./scripts/build/prepare-kernel.sh kernel "$KERNEL_REPOSITORY" "$KERNEL_REF"
          ./scripts/build/build-kernel.sh chromiumos kernel artifacts -yogabook7.2
      - name: Upload ChromiumOS kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-chromiumos-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
