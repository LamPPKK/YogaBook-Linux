name: Build native Yoga Book packages

on:
  workflow_dispatch:
    inputs:
      kernel-ref:
        description: Kernel tag or branch
        required: true
        default: v6.18.x-yogabook

permissions:
  contents: read

env:
  KERNEL_REPOSITORY: https://github.com/jekhor/yogabook-linux-kernel.git
  KERNEL_REF: ${{ inputs.kernel-ref || 'v6.18.x-yogabook' }}

jobs:
  fedora-rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora build dependencies
        run: |
          dnf install -y bc bison cpio dwarves flex gcc gcc-c++ make \
            openssl openssl-devel perl elfutils-devel elfutils-libelf-devel \
            rsync rpm-build git curl
      - name: Build RPM packages
        run: |
          git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_REPOSITORY" kernel
          git -C kernel config user.name yogabook-ci
          git -C kernel config user.email yogabook-ci@localhost
          curl --fail --location --retry 3 \
            'https://patchew.org/linux/20260831180101.3109854-1-mauriziocasciano7@gmail.com/mbox' \
            -o camera-series.mbox
          if ! git -C kernel am --keep-non-patch ../camera-series.mbox; then
            git -C kernel am --show-current-patch=raw \
              | grep -q 'Subject: \[PATCH v5 06/16\] media: intel: ipu-bridge:'
            git -C kernel am --skip || true
            if git -C kernel am --show-current-patch=raw \
              | grep -q 'Subject: \[PATCH v5 16/16\] media: i2c: Add WV517S lens actuator driver'; then
              git -C kernel am --show-current-patch=diff > "$GITHUB_WORKSPACE/wv517s.patch"
              git -C kernel am --skip
              git -C kernel apply --reject --whitespace=nowarn "$GITHUB_WORKSPACE/wv517s.patch" || true
              if ! grep -q 'obj-$(CONFIG_VIDEO_WV517S) += wv517s.o' kernel/drivers/media/i2c/Makefile; then
                sed -i '/obj-$(CONFIG_VIDEO_WM8775) += wm8775.o/a obj-$(CONFIG_VIDEO_WV517S) += wv517s.o' kernel/drivers/media/i2c/Makefile
              fi
              rm -f kernel/drivers/media/i2c/Makefile.rej
              git -C kernel add MAINTAINERS drivers/media/i2c
              git -C kernel commit -m 'media: i2c: Add WV517S lens actuator driver'
            fi
            git -C kernel apply "$GITHUB_WORKSPACE/patches/camera/ipu-bridge-yogabook.patch"
          fi
          cd kernel
          make yogabook_defconfig
          make LOCALVERSION=-yogabook -j"$(nproc)"
          make LOCALVERSION=-yogabook binrpm-pkg -j"$(nproc)"
      - name: Upload Fedora RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-fedora-${{ github.sha }}
          path: '*.rpm'
          if-no-files-found: error

  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed bc bison cpio pahole flex \
            gcc make openssl libelf python rsync tar xz git curl
      - name: Build kernel and modules archive
        run: |
          git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_REPOSITORY" kernel
          git -C kernel config user.name yogabook-ci
          git -C kernel config user.email yogabook-ci@localhost
          curl --fail --location --retry 3 \
            'https://patchew.org/linux/20260831180101.3109854-1-mauriziocasciano7@gmail.com/mbox' \
            -o camera-series.mbox
          if ! git -C kernel am --keep-non-patch ../camera-series.mbox; then
            git -C kernel am --show-current-patch=raw \
              | grep -q 'Subject: \[PATCH v5 06/16\] media: intel: ipu-bridge:'
            git -C kernel am --skip || true
            if git -C kernel am --show-current-patch=raw \
              | grep -q 'Subject: \[PATCH v5 16/16\] media: i2c: Add WV517S lens actuator driver'; then
              git -C kernel am --show-current-patch=diff > "$GITHUB_WORKSPACE/wv517s.patch"
              git -C kernel am --skip
              git -C kernel apply --reject --whitespace=nowarn "$GITHUB_WORKSPACE/wv517s.patch" || true
              if ! grep -q 'obj-$(CONFIG_VIDEO_WV517S) += wv517s.o' kernel/drivers/media/i2c/Makefile; then
                sed -i '/obj-$(CONFIG_VIDEO_WM8775) += wm8775.o/a obj-$(CONFIG_VIDEO_WV517S) += wv517s.o' kernel/drivers/media/i2c/Makefile
              fi
              rm -f kernel/drivers/media/i2c/Makefile.rej
              git -C kernel add MAINTAINERS drivers/media/i2c
              git -C kernel commit -m 'media: i2c: Add WV517S lens actuator driver'
            fi
            git -C kernel apply "$GITHUB_WORKSPACE/patches/camera/ipu-bridge-yogabook.patch"
          fi
          cd kernel
          make yogabook_defconfig
          make LOCALVERSION=-yogabook -j"$(nproc)"
          make LOCALVERSION=-yogabook INSTALL_MOD_PATH="$PWD/package" \
            modules_install
          mkdir -p ../artifacts
          cp arch/x86/boot/bzImage ../artifacts/vmlinuz-yogabook
          tar -C package -czf ../artifacts/yogabook-modules.tar.gz lib/modules
          sha256sum ../artifacts/* > ../artifacts/SHA256SUMS
      - name: Upload Arch kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-arch-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  chromiumos-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ChromiumOS kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential cpio dwarves flex libdw-dev \
            libelf-dev libssl-dev rsync kmod git curl
      - name: Build generic ChromiumOS-compatible x86 kernel
        run: |
          git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_REPOSITORY" kernel
          git -C kernel config user.name yogabook-ci
          git -C kernel config user.email yogabook-ci@localhost
          curl --fail --location --retry 3 \
            'https://patchew.org/linux/20260831180101.3109854-1-mauriziocasciano7@gmail.com/mbox' \
            -o camera-series.mbox
          if ! git -C kernel am --keep-non-patch ../camera-series.mbox; then
            git -C kernel am --show-current-patch=raw \
              | grep -q 'Subject: \[PATCH v5 06/16\] media: intel: ipu-bridge:'
            git -C kernel am --skip || true
            if git -C kernel am --show-current-patch=raw \
              | grep -q 'Subject: \[PATCH v5 16/16\] media: i2c: Add WV517S lens actuator driver'; then
              git -C kernel am --show-current-patch=diff > "$GITHUB_WORKSPACE/wv517s.patch"
              git -C kernel am --skip
              git -C kernel apply --reject --whitespace=nowarn "$GITHUB_WORKSPACE/wv517s.patch" || true
              if ! grep -q 'obj-$(CONFIG_VIDEO_WV517S) += wv517s.o' kernel/drivers/media/i2c/Makefile; then
                sed -i '/obj-$(CONFIG_VIDEO_WM8775) += wm8775.o/a obj-$(CONFIG_VIDEO_WV517S) += wv517s.o' kernel/drivers/media/i2c/Makefile
              fi
              rm -f kernel/drivers/media/i2c/Makefile.rej
              git -C kernel add MAINTAINERS drivers/media/i2c
              git -C kernel commit -m 'media: i2c: Add WV517S lens actuator driver'
            fi
            git -C kernel apply "$GITHUB_WORKSPACE/patches/camera/ipu-bridge-yogabook.patch"
          fi
          cd kernel
          make x86_64_defconfig
          make LOCALVERSION=-yogabook -j"$(nproc)"
          mkdir -p ../artifacts
          cp arch/x86/boot/bzImage ../artifacts/vmlinuz-yogabook-chromiumos
          make INSTALL_MOD_PATH="$PWD/../modules" modules_install
          tar -C ../modules -czf ../artifacts/yogabook-chromiumos-modules.tar.gz lib/modules
          sha256sum ../artifacts/* > ../artifacts/SHA256SUMS
      - name: Upload ChromiumOS kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-chromiumos-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
