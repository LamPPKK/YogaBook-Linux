name: Build latest Yoga Book userspace packages

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: touch-keyboard
            repository: https://github.com/LamPPKK/YogaBook-Linux-Touch-Keyboard.git
            ref: master
          - name: alsa-ucm-conf-yogabook
            repository: https://github.com/LamPPKK/YogaBook-Linux-ALSA-UCM.git
            ref: main
          - name: yogabook-support
            repository: https://github.com/LamPPKK/YogaBook-Linux-Support.git
            ref: main

    steps:
      - uses: actions/checkout@v4
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake debhelper devscripts dpkg-dev git \
            curl ca-certificates libevdev-dev libglib2.0-dev libinput-dev \
            libsystemd-dev systemd-dev udev libudev-dev pkg-config

      - name: Build Debian package
        run: |
          ./scripts/build/build-userspace-deb.sh \
            "${{ matrix.name }}" \
            "${{ matrix.repository }}" \
            "${{ matrix.ref }}" \
            "artifacts/${{ matrix.name }}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-${{ matrix.name }}-deb-${{ github.sha }}
          path: artifacts/${{ matrix.name }}/
          if-no-files-found: error
