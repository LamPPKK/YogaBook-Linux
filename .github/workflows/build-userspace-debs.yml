name: Build latest Yoga Book userspace packages

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: touch-keyboard
            repository: https://github.com/jekhor/chromiumos_touch_keyboard.git
            ref: master
          - name: alsa-ucm-conf-yogabook
            repository: https://github.com/jekhor/alsa-ucm-conf-yogabook.git
            ref: main
          - name: yogabook-support
            repository: https://github.com/jekhor/yogabook-support.git
            ref: main

    steps:
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake debhelper devscripts dpkg-dev git \
            curl ca-certificates libevdev-dev libglib2.0-dev libinput-dev \
            libsystemd-dev libudev-dev pkg-config

      - name: Check out latest upstream source
        run: |
          set -euxo pipefail
          archive_repository="${{ matrix.repository }}"
          archive_repository="${archive_repository%.git}"
          archive_url="$archive_repository/archive/refs/heads/${{ matrix.ref }}.tar.gz"
          curl --fail --location --retry 3 "$archive_url" -o source.tar.gz
          tar -xzf source.tar.gz
          source_dir=$(find . -mindepth 1 -maxdepth 1 -type d -name '*-*' -print -quit)
          test -n "$source_dir"
          mv "$source_dir" "${{ matrix.name }}"
          git ls-remote "${{ matrix.repository }}" "refs/heads/${{ matrix.ref }}" \
            | awk '{print $1}' > "${{ matrix.name }}/SOURCE_COMMIT"

      - name: Build Debian package
        working-directory: ${{ matrix.name }}
        run: dpkg-buildpackage -b -us -uc

      - name: Collect package and source metadata
        run: |
          mkdir -p artifacts/${{ matrix.name }}
          cp ./*.deb artifacts/${{ matrix.name }}/
          cp "${{ matrix.name }}/SOURCE_COMMIT" artifacts/${{ matrix.name }}/
          sha256sum artifacts/${{ matrix.name }}/* > artifacts/${{ matrix.name }}/SHA256SUMS

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-${{ matrix.name }}-deb-${{ github.sha }}
          path: artifacts/${{ matrix.name }}/
          if-no-files-found: error
